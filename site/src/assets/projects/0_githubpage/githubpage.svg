<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient (Dark Charcoal/Obsidian) -->
    <linearGradient id="gh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c0f"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#0a0d11"/>
    </linearGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="gh-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1f2835" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#gh-bg)"/>
  <rect width="1200" height="675" fill="url(#gh-grid)"/>

  <!-- ==================== BROWSER WINDOW MOCKUP ==================== -->
  <g transform="translate(50, 30)">
    <!-- Browser Chassis Frame -->
    <rect width="1100" height="615" rx="12" fill="#0f141a" stroke="#1f2734" stroke-width="1.2"/>
    
    <!-- Browser Chrome Header -->
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 1088 0 C 1094.627 0 1100 5.373 1100 12 L 1100 42 L 0 42 Z" fill="#141920"/>
    <line x1="0" y1="42" x2="1100" y2="42" stroke="#1d2531" stroke-width="1"/>

    <!-- Traffic Light Window Controls -->
    <circle cx="24" cy="21" r="5" fill="#434f5e"/>
    <circle cx="40" cy="21" r="5" fill="#434f5e"/>
    <circle cx="56" cy="21" r="5" fill="#434f5e"/>

    <!-- Browser Tab -->
    <g transform="translate(80, 8)">
      <rect width="170" height="26" rx="6" fill="#0f141a"/>
      <text x="16" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f0f3f6">
        hdg-zero.github.io
      </text>
    </g>

    <!-- Browser URL Bar -->
    <g transform="translate(300, 8)">
      <rect width="500" height="26" rx="6" fill="#0b0e12" stroke="#1f2734" stroke-width="1"/>
      
      <!-- Lock Icon -->
      <g transform="translate(14, 6)">
        <rect x="0" y="4" width="9" height="7" rx="1.5" fill="#6e7885"/>
        <path d="M 2 4 V 2 C 2 0.9 3.1 0 4.5 0 C 5.9 0 7 0.9 7 2 V 4" fill="none" stroke="#6e7885" stroke-width="1.2"/>
      </g>
      
      <!-- URL Text -->
      <text x="32" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d0d7de">
        https://hdg-zero.github.io/
      </text>

      <!-- Astro 7 Badge -->
      <g transform="translate(425, 4)">
        <rect width="65" height="18" rx="4" fill="#161c24"/>
        <text x="32.5" y="13" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#8b949e" text-anchor="middle">ASTRO 7</text>
      </g>
    </g>

    <!-- ==================== VIEWPORT CONTENT ==================== -->
    <g transform="translate(0, 42)">
      <!-- 1. Header / Navbar -->
      <g transform="translate(60, 24)">
        <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f0f3f6" letter-spacing="-0.5">
          hdg.zero
        </text>

        <g transform="translate(680, 6)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#8b949e">
          <text x="0" y="14" fill="#f0f3f6" font-weight="600">Projets</text>
          <text x="70" y="14">Blog</text>
          <text x="130" y="14">GitHub</text>
          
          <rect x="200" y="0" width="50" height="20" rx="4" fill="#141920" stroke="#1f2734" stroke-width="1"/>
          <text x="225" y="14" font-size="10.5" font-weight="600" fill="#8b949e" text-anchor="middle">FR / EN</text>
        </g>
        
        <line x1="0" y1="36" x2="980" y2="36" stroke="#18202a" stroke-width="1"/>
      </g>

      <!-- 2. Hero Section -->
      <g transform="translate(550, 120)" text-anchor="middle">
        <!-- Status Pill -->
        <rect x="-160" y="0" width="320" height="26" rx="13" fill="#12171e" stroke="#1f2734" stroke-width="1"/>
        <circle cx="-140" cy="13" r="3" fill="#527c67"/>
        <text x="4" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#8b949e">
          Ingénieur Systèmes &amp; Sécurité • Linux &amp; IA
        </text>

        <!-- Main Headline -->
        <text y="64" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f0f3f6" letter-spacing="-0.5">
          Bâtir des systèmes fiables,
        </text>
        <text y="104" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#c2cdd8" letter-spacing="-0.5">
          isolés &amp; souverains.
        </text>

        <!-- Subtitle -->
        <text y="142" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#7a8594">
          Sécurité des conteneurs Linux rootless, souveraineté des données et intégration locale d'outils d'IA.
        </text>

        <!-- Action CTAs -->
        <g transform="translate(0, 168)">
          <rect x="-135" y="0" width="140" height="34" rx="6" fill="#182029" stroke="#2a3545" stroke-width="1"/>
          <text x="-65" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f0f3f6">
            Explorer les projets
          </text>

          <rect x="15" y="0" width="120" height="34" rx="6" fill="#12171e" stroke="#1f2734" stroke-width="1"/>
          <text x="75" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#8b949e">
            Lire le blog
          </text>
        </g>
      </g>

      <!-- 3. Minimalist Architecture Strip -->
      <g transform="translate(60, 420)">
        <rect width="980" height="88" rx="10" fill="#11161d" stroke="#1d2633" stroke-width="1"/>
        
        <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#7a8594" letter-spacing="1">
          ARCHITECTURE TECHNIQUE DU SITE
        </text>
        <text x="956" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#525f70" text-anchor="end">
          100 / 100 LIGHTHOUSE
        </text>

        <g transform="translate(24, 42)">
          <!-- Pill 1 -->
          <g transform="translate(0, 0)">
            <rect width="215" height="30" rx="6" fill="#151b24" stroke="#222b38" stroke-width="1"/>
            <text x="107" y="19" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8b949e" text-anchor="middle">Astro 7 (Content Layer)</text>
          </g>
          
          <!-- Pill 2 -->
          <g transform="translate(235, 0)">
            <rect width="215" height="30" rx="6" fill="#151b24" stroke="#222b38" stroke-width="1"/>
            <text x="107" y="19" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8b949e" text-anchor="middle">Zero Client-Side JS</text>
          </g>

          <!-- Pill 3 -->
          <g transform="translate(470, 0)">
            <rect width="215" height="30" rx="6" fill="#151b24" stroke="#222b38" stroke-width="1"/>
            <text x="107" y="19" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8b949e" text-anchor="middle">Tailwind CSS v4 Engine</text>
          </g>

          <!-- Pill 4 -->
          <g transform="translate(705, 0)">
            <rect width="225" height="30" rx="6" fill="#151b24" stroke="#222b38" stroke-width="1"/>
            <text x="112" y="19" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8b949e" text-anchor="middle">GitHub Pages Automation</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
