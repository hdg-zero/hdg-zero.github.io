<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="gh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b10"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="pipe-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <pattern id="gh-dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#gh-bg)"/>
  <rect width="1200" height="675" fill="url(#gh-dots)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="300" cy="180" r="280" fill="#5eead4" opacity="0.06" filter="blur(60px)"/>
  <circle cx="900" cy="400" r="260" fill="#38bdf8" opacity="0.05" filter="blur(60px)"/>

  <!-- Top Title Banner -->
  <g transform="translate(60, 48)">
    <rect width="1080" height="60" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    
    <!-- Octocat / Git icon -->
    <g transform="translate(24, 15)">
      <circle cx="15" cy="15" r="14" fill="#21262d"/>
      <path d="M15 6 C10.03 6 6 10.03 6 15 C6 18.98 8.58 22.35 12.16 23.54 C12.61 23.62 12.77 23.34 12.77 23.1 C12.77 22.89 12.76 22.18 12.76 21.36 C10.5 21.78 9.94 20.73 9.76 20.23 C9.66 19.98 9.22 19.18 8.84 18.97 C8.52 18.8 8.07 18.38 8.83 18.37 C9.54 18.36 10.05 19.02 10.22 19.29 C11.03 20.66 12.33 20.27 12.85 20.03 C12.93 19.44 13.17 19.04 13.43 18.81 C11.42 18.58 9.32 17.8 9.32 14.34 C9.32 13.35 9.67 12.54 10.25 11.91 C10.16 11.68 9.85 10.75 10.34 9.5 C10.34 9.5 11.1 9.26 12.83 10.43 C13.55 10.23 14.33 10.13 15.11 10.13 C15.89 10.13 16.67 10.23 17.39 10.43 C19.12 9.26 19.88 9.5 19.88 9.5 C20.37 10.75 20.06 11.68 19.97 11.91 C20.55 12.54 20.9 13.34 20.9 14.34 C20.9 17.81 18.79 18.58 16.78 18.81 C17.11 19.09 17.39 19.64 17.39 20.5 C17.39 21.73 17.38 22.72 17.38 23.1 C17.38 23.35 17.54 23.63 18 23.54 C21.58 22.35 24.16 18.97 24.16 15 C24.16 10.03 20.13 6 15 6 Z" fill="#e6edf3"/>
    </g>
    
    <text x="70" y="36" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#e6edf3">
      hdg-zero.github.io
    </text>
    <text x="260" y="36" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8b949e">
      // Automated GitOps Deployment Pipeline
    </text>

    <!-- Branch Pill -->
    <g transform="translate(870, 16)">
      <rect width="186" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#5eead4"/>
      <text x="28" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#5eead4">main branch : deployed</text>
    </g>
  </g>

  <!-- PIPELINE STAGES (3 Nodes connected with Glowing Bus) -->
  <g id="pipeline" transform="translate(60, 150)">
    <!-- Connecting Bus Line -->
    <line x1="200" y1="110" x2="880" y2="110" stroke="url(#pipe-line)" stroke-width="3" stroke-dasharray="6,6"/>

    <!-- STAGE 1: Source & Build -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="320" height="220" rx="14" fill="#0d1117" stroke="url(#card-border)" stroke-width="1.5"/>
      <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 306 0 C 313.732 0 320 6.268 320 14 L 320 40 L 0 40 Z" fill="#161b22"/>
      <line x1="0" y1="40" x2="320" y2="40" stroke="#30363d" stroke-width="1"/>
      
      <circle cx="20" cy="20" r="5" fill="#5eead4"/>
      <text x="35" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e6edf3">01 // CODEBASE</text>
      <text x="300" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8b949e" text-anchor="end">INPUT</text>

      <g transform="translate(20, 65)" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e6edf3">
        <text y="0" fill="#5eead4">⚡ Astro 7.3</text> <text x="110" y="0" fill="#8b949e">(Zero-JS baseline)</text>
        <text y="26" fill="#79c0ff">📦 Content Layer</text> <text x="135" y="26" fill="#8b949e">(glob loader)</text>
        <text y="52" fill="#d2a8ff">🎨 Tailwind v4</text> <text x="120" y="52" fill="#8b949e">(@plugin typography)</text>
        <text y="78" fill="#7ee787">🌐 Dual-Lang i18n</text> <text x="145" y="78" fill="#8b949e">(FR &amp; EN sync)</text>
        <text y="110" fill="#e6edf3" font-size="11">git commit -m "site update"</text>
      </g>
    </g>

    <!-- STAGE 2: CI/CD Engine (GitHub Actions) -->
    <g transform="translate(380, 0)" filter="url(#shadow)">
      <rect width="320" height="220" rx="14" fill="#0d1117" stroke="url(#card-border)" stroke-width="1.5"/>
      <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 306 0 C 313.732 0 320 6.268 320 14 L 320 40 L 0 40 Z" fill="#161b22"/>
      <line x1="0" y1="40" x2="320" y2="40" stroke="#30363d" stroke-width="1"/>
      
      <circle cx="20" cy="20" r="5" fill="#38bdf8"/>
      <text x="35" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e6edf3">02 // CI/CD WORKFLOW</text>
      <text x="300" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5eead4" text-anchor="end">RUNNING</text>

      <g transform="translate(20, 65)" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e6edf3">
        <text y="0" fill="#7ee787">✓</text> <text x="20" y="0">Setup Node.js 22 &amp; pnpm</text>
        <text y="26" fill="#7ee787">✓</text> <text x="20" y="26">Typecheck &amp; ESLint rules</text>
        <text y="52" fill="#7ee787">✓</text> <text x="20" y="52">Static SSG Render: 13 routes</text>
        <text y="78" fill="#7ee787">✓</text> <text x="20" y="78">Sharp Image WebP pipeline</text>
        <text y="110" fill="#38bdf8" font-size="11">actions/deploy-pages@v4</text>
      </g>
    </g>

    <!-- STAGE 3: Edge Static Serving -->
    <g transform="translate(760, 0)" filter="url(#shadow)">
      <rect width="320" height="220" rx="14" fill="#0d1117" stroke="url(#card-border)" stroke-width="1.5"/>
      <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 306 0 C 313.732 0 320 6.268 320 14 L 320 40 L 0 40 Z" fill="#161b22"/>
      <line x1="0" y1="40" x2="320" y2="40" stroke="#30363d" stroke-width="1"/>
      
      <circle cx="20" cy="20" r="5" fill="#2dd4bf"/>
      <text x="35" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e6edf3">03 // EDGE PLATFORM</text>
      <text x="300" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7ee787" text-anchor="end">LIVE</text>

      <g transform="translate(20, 65)" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e6edf3">
        <text y="0" fill="#2dd4bf">🔒 HTTPS / TLS 1.3 Strict</text>
        <text y="26" fill="#2dd4bf">⚡ Global Fastly Anycast CDN</text>
        <text y="52" fill="#2dd4bf">⏱️ TTFB: &lt; 25 ms</text>
        <text y="78" fill="#2dd4bf">🛡️ Strict CSP &amp; Zero Trackers</text>
        <text y="110" fill="#e6edf3" font-size="11">Status: 200 OK (Cache: HIT)</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM CARD: Lighthouse Perfect 100 Scores & Metrics -->
  <g transform="translate(60, 410)" filter="url(#shadow)">
    <rect width="1080" height="215" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    
    <!-- Title -->
    <text x="30" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#e6edf3">
      PERFORMANCE &amp; AUDIT TELEMETRY (Lighthouse &amp; Core Web Vitals)
    </text>

    <!-- 4 Circular Badges (100 / 100 / 100 / 100) -->
    <!-- Metric 1: Performance -->
    <g transform="translate(80, 75)">
      <circle cx="45" cy="45" r="38" fill="none" stroke="#21262d" stroke-width="7"/>
      <circle cx="45" cy="45" r="38" fill="none" stroke="#5eead4" stroke-width="7" stroke-dasharray="238.7" stroke-dashoffset="0"/>
      <text x="45" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#5eead4" text-anchor="middle">100</text>
      <text x="45" y="105" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">Performance</text>
    </g>

    <!-- Metric 2: Accessibility -->
    <g transform="translate(260, 75)">
      <circle cx="45" cy="45" r="38" fill="none" stroke="#21262d" stroke-width="7"/>
      <circle cx="45" cy="45" r="38" fill="none" stroke="#5eead4" stroke-width="7" stroke-dasharray="238.7" stroke-dashoffset="0"/>
      <text x="45" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#5eead4" text-anchor="middle">100</text>
      <text x="45" y="105" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">Accessibility</text>
    </g>

    <!-- Metric 3: Best Practices -->
    <g transform="translate(440, 75)">
      <circle cx="45" cy="45" r="38" fill="none" stroke="#21262d" stroke-width="7"/>
      <circle cx="45" cy="45" r="38" fill="none" stroke="#5eead4" stroke-width="7" stroke-dasharray="238.7" stroke-dashoffset="0"/>
      <text x="45" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#5eead4" text-anchor="middle">100</text>
      <text x="45" y="105" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">Best Practices</text>
    </g>

    <!-- Metric 4: SEO -->
    <g transform="translate(620, 75)">
      <circle cx="45" cy="45" r="38" fill="none" stroke="#21262d" stroke-width="7"/>
      <circle cx="45" cy="45" r="38" fill="none" stroke="#5eead4" stroke-width="7" stroke-dasharray="238.7" stroke-dashoffset="0"/>
      <text x="45" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#5eead4" text-anchor="middle">100</text>
      <text x="45" y="105" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">SEO</text>
    </g>

    <!-- Right Side Stats Details -->
    <g transform="translate(770, 75)" font-family="'JetBrains Mono', monospace" font-size="12">
      <rect width="270" height="105" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="18" y="28" fill="#8b949e">First Contentful Paint:</text>
      <text x="210" y="28" fill="#5eead4" font-weight="700">0.3 s</text>

      <text x="18" y="52" fill="#8b949e">Largest Contentful Paint:</text>
      <text x="210" y="52" fill="#5eead4" font-weight="700">0.5 s</text>

      <text x="18" y="76" fill="#8b949e">Cumulative Layout Shift:</text>
      <text x="210" y="76" fill="#5eead4" font-weight="700">0.000</text>

      <text x="18" y="96" fill="#8b949e">Total Blocking Time:</text>
      <text x="210" y="96" fill="#5eead4" font-weight="700">0 ms</text>
    </g>
  </g>
</svg>
