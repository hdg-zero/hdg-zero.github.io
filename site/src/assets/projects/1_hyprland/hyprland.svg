<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient (Dark Charcoal/Obsidian) -->
    <linearGradient id="hypr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c0f"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#0a0d11"/>
    </linearGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="hypr-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1f2835" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#hypr-bg)"/>
  <rect width="1200" height="675" fill="url(#hypr-grid)"/>

  <!-- ==================== TOP BAR: Waybar ==================== -->
  <g id="waybar" transform="translate(30, 20)">
    <rect width="1140" height="36" rx="8" fill="#10151c" stroke="#1d2633" stroke-width="1"/>
    
    <!-- Workspaces Left -->
    <g transform="translate(12, 7)">
      <!-- Active workspace 1 -->
      <rect width="28" height="22" rx="4" fill="#161c24" stroke="#253040" stroke-width="1"/>
      <circle cx="8" cy="11" r="2" fill="#527c67"/>
      <text x="17" y="15" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f0f3f6" text-anchor="middle">1</text>
      
      <!-- Inactive workspaces -->
      <text x="44" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#525f70" text-anchor="middle">2</text>
      <text x="64" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#525f70" text-anchor="middle">3</text>
      <text x="84" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#525f70" text-anchor="middle">4</text>
    </g>

    <!-- Center Window Title -->
    <text x="570" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7a8594" text-anchor="middle">
      hyprland // ~/.config/hypr/hyprland.conf
    </text>

    <!-- Right System Modules -->
    <g transform="translate(870, 8)" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <rect x="0" width="75" height="20" rx="4" fill="#141920"/>
      <text x="37" y="14" fill="#8b949e" text-anchor="middle">CPU 2.4%</text>

      <rect x="82" width="95" height="20" rx="4" fill="#141920"/>
      <text x="129" y="14" fill="#8b949e" text-anchor="middle">RAM 760 MB</text>

      <rect x="184" width="76" height="20" rx="4" fill="#141920"/>
      <text x="222" y="14" fill="#8b949e" text-anchor="middle">165Hz</text>
    </g>
  </g>

  <!-- ==================== TILING WINDOW 1: Master Terminal (Left) ==================== -->
  <g id="window-master" transform="translate(30, 72)">
    <rect width="680" height="575" rx="10" fill="#0f141a" stroke="#222b37" stroke-width="1.2"/>
    
    <!-- Titlebar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 670 0 C 675.523 0 680 4.477 680 10 L 680 34 L 0 34 Z" fill="#141920"/>
    <line x1="0" y1="34" x2="680" y2="34" stroke="#1d2531" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="18" cy="17" r="5" fill="#434f5e"/>
    <circle cx="34" cy="17" r="5" fill="#434f5e"/>
    <circle cx="50" cy="17" r="5" fill="#434f5e"/>
    <text x="72" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7a8594">kitty — archlinux: ~/dotfiles</text>

    <!-- Terminal Code -->
    <g transform="translate(24, 60)" font-family="'JetBrains Mono', monospace" font-size="12" xml:space="preserve">
      <text y="0" fill="#525f70"># Monitors &amp; Workspaces Configuration</text>
      
      <text y="26" fill="#8b949e">monitor</text><text x="65" y="26" fill="#d0d7de"> = DP-1, 2560x1440@165Hz, 0x0, 1</text>
      <text y="48" fill="#8b949e">monitor</text><text x="65" y="48" fill="#d0d7de"> = HDMI-A-1, 1920x1080@60Hz, 2560x0, 1</text>
      
      <text y="88" fill="#525f70"># Modifiers &amp; Keybindings</text>
      <text y="112" fill="#8b949e">$mainMod</text><text x="75" y="112" fill="#d0d7de"> = SUPER</text>
      <text y="134" fill="#8b949e">bind</text><text x="45" y="134" fill="#d0d7de"> = $mainMod, Return, exec, kitty</text>
      <text y="156" fill="#8b949e">bind</text><text x="45" y="156" fill="#d0d7de"> = $mainMod, Space,  exec, rofi -show drun</text>
      <text y="178" fill="#8b949e">bind</text><text x="45" y="178" fill="#d0d7de"> = $mainMod, Q,      killactive</text>
      <text y="200" fill="#8b949e">bind</text><text x="45" y="200" fill="#d0d7de"> = $mainMod SHIFT, E, exit</text>
      
      <text y="240" fill="#525f70"># Smooth Bezier Animations &amp; Dwindle Tiling</text>
      <text y="262" fill="#8b949e">general</text><text x="68" y="262" fill="#d0d7de"> {</text>
      <text x="20" y="284" fill="#8b949e">gaps_in</text><text x="90" y="284" fill="#d0d7de"> = 6</text>
      <text x="20" y="306" fill="#8b949e">gaps_out</text><text x="90" y="306" fill="#d0d7de"> = 12</text>
      <text x="20" y="328" fill="#8b949e">border_size</text><text x="120" y="328" fill="#d0d7de"> = 2</text>
      <text y="350" fill="#d0d7de">}</text>

      <text y="404" fill="#7a8594">[hdg@arch ~]$</text>
      <text x="135" y="404" fill="#f0f3f6">hyprctl version | head -n 2</text>
      <text y="428" fill="#525f70">Hyprland, built from branch main (Wayland native compositor)</text>
      <text y="452" fill="#7a8594">[hdg@arch ~]$</text>
      <rect x="135" y="440" width="8" height="15" fill="#7a8594" opacity="0.8"/>
    </g>
  </g>

  <!-- ==================== TILING WINDOW 2: Telemetry Stack (Right) ==================== -->
  <g id="window-telemetry" transform="translate(730, 72)">
    <rect width="440" height="575" rx="10" fill="#0f141a" stroke="#1f2734" stroke-width="1.2"/>
    
    <!-- Titlebar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 430 0 C 435.523 0 440 4.477 440 10 L 440 34 L 0 34 Z" fill="#141920"/>
    <line x1="0" y1="34" x2="440" y2="34" stroke="#1d2531" stroke-width="1"/>
    
    <circle cx="18" cy="17" r="5" fill="#434f5e"/>
    <circle cx="34" cy="17" r="5" fill="#434f5e"/>
    <circle cx="50" cy="17" r="5" fill="#434f5e"/>
    <text x="72" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7a8594">btop — resource telemetry</text>

    <!-- Telemetry Content -->
    <g transform="translate(24, 58)" font-family="'JetBrains Mono', monospace">
      <!-- CPU telemetry header -->
      <text y="0" font-size="11" font-weight="700" fill="#7a8594">CPU USAGE [AMD RYZEN 7]</text>

      <g transform="translate(0, 16)" font-size="11">
        <text y="16" fill="#8b949e">Core 0</text>
        <rect x="60" y="8" width="330" height="8" rx="2" fill="#151b24"/>
        <rect x="60" y="8" width="85" height="8" rx="2" fill="#323e4e"/>

        <text y="36" fill="#8b949e">Core 1</text>
        <rect x="60" y="28" width="330" height="8" rx="2" fill="#151b24"/>
        <rect x="60" y="28" width="140" height="8" rx="2" fill="#3b4859"/>

        <text y="56" fill="#8b949e">Core 2</text>
        <rect x="60" y="48" width="330" height="8" rx="2" fill="#151b24"/>
        <rect x="60" y="48" width="45" height="8" rx="2" fill="#323e4e"/>

        <text y="76" fill="#8b949e">Core 3</text>
        <rect x="60" y="68" width="330" height="8" rx="2" fill="#151b24"/>
        <rect x="60" y="68" width="180" height="8" rx="2" fill="#4a5a6e"/>
      </g>

      <!-- Memory & Compositing Stats -->
      <g transform="translate(0, 130)">
        <text y="0" font-size="11" font-weight="700" fill="#7a8594">FOOTPRINT &amp; COMPOSITING</text>
        
        <rect y="14" width="190" height="52" rx="6" fill="#131820" stroke="#1f2734" stroke-width="1"/>
        <text x="14" y="34" font-size="10" fill="#525f70">RESIDENT RAM</text>
        <text x="14" y="52" font-size="14" font-weight="700" fill="#f0f3f6">&lt; 800 MB</text>

        <rect x="202" y="14" width="190" height="52" rx="6" fill="#131820" stroke="#1f2734" stroke-width="1"/>
        <text x="14" y="34" transform="translate(202, 0)" font-size="10" fill="#525f70">WAYLAND LATENCY</text>
        <text x="14" y="52" transform="translate(202, 0)" font-size="14" font-weight="700" fill="#f0f3f6">1.2 ms (165Hz)</text>
      </g>

      <!-- Wayland Native Stack List -->
      <g transform="translate(0, 240)">
        <text y="0" font-size="11" font-weight="700" fill="#7a8594">WAYLAND NATIVE ECOSYSTEM</text>
        
        <g transform="translate(0, 16)" font-size="11" fill="#8b949e">
          <text y="14">├── waybar        <tspan fill="#525f70">(Status bar &amp; system tray)</tspan></text>
          <text y="36">├── rofi-wayland  <tspan fill="#525f70">(Application launcher)</tspan></text>
          <text y="58">├── kitty         <tspan fill="#525f70">(GPU-accelerated terminal)</tspan></text>
          <text y="80">└── dunst         <tspan fill="#525f70">(Lightweight notifications)</tspan></text>
        </g>

        <!-- Status Tag -->
        <g transform="translate(0, 130)">
          <rect width="392" height="32" rx="6" fill="#131820" stroke="#1f2734" stroke-width="1"/>
          <circle cx="16" cy="16" r="3" fill="#527c67"/>
          <text x="28" y="20" font-size="10.5" font-weight="600" fill="#8b949e">100% Wayland Native (Zero XWayland Fallbacks)</text>
        </g>
      </g>
    </g>
  </g>
</svg>
