<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="mdp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="50%" stop-color="#0c1118"/>
      <stop offset="100%" stop-color="#080d13"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d29"/>
      <stop offset="100%" stop-color="#0e151f"/>
    </linearGradient>
    <filter id="glow-cipher" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="mdp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5eead4" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#mdp-bg)"/>
  <rect width="1200" height="675" fill="url(#mdp-grid)"/>

  <!-- Ambient Light -->
  <circle cx="260" cy="220" r="280" fill="#5eead4" opacity="0.06" filter="blur(60px)"/>
  <circle cx="940" cy="420" r="280" fill="#38bdf8" opacity="0.05" filter="blur(60px)"/>

  <!-- Top Header Bar -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="58" rx="12" fill="#131b26" stroke="#253346" stroke-width="1.2"/>
    
    <!-- Shield Icon -->
    <g transform="translate(24, 13)">
      <path d="M16 2 L2 7 V14 C2 21.5 8 28.5 16 30 C24 28.5 30 21.5 30 14 V7 Z" fill="none" stroke="#5eead4" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="16" cy="14" r="3.5" fill="#5eead4"/>
      <path d="M16 17.5 V22" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
    </g>

    <text x="70" y="35" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#f8fafc">
      ZERO-KNOWLEDGE VAULT ARCHITECTURE
    </text>
    <text x="440" y="35" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8b949e">
      // Argon2id Memory-Hard Cryptographic Derivation
    </text>

    <!-- Badge -->
    <g transform="translate(900, 16)">
      <rect width="156" height="26" rx="13" fill="#5eead4" fill-opacity="0.15" stroke="#5eead4" stroke-width="1"/>
      <circle cx="14" cy="13" r="3.5" fill="#5eead4"/>
      <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#5eead4">E2EE VERIFIED</text>
    </g>
  </g>

  <!-- CRYPTOGRAPHIC PIPELINE FLOW: 3 STAGES -->
  <g transform="translate(60, 130)">
    
    <!-- Step 1: Input Master Password & Salt -->
    <g transform="translate(0, 0)" filter="url(#glow-cipher)">
      <rect width="320" height="240" rx="14" fill="url(#box-grad)" stroke="#27384e" stroke-width="1.5"/>
      <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 306 0 C 313.732 0 320 6.268 320 14 L 320 40 L 0 40 Z" fill="#1b2535"/>
      <line x1="0" y1="40" x2="320" y2="40" stroke="#2a3a52" stroke-width="1"/>
      
      <circle cx="20" cy="20" r="5" fill="#5eead4"/>
      <text x="35" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f8fafc">01 // CLIENT ENTROPY</text>

      <g transform="translate(20, 68)" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">
        <text y="0" fill="#8b949e">Master Password</text>
        <rect y="10" width="280" height="34" rx="6" fill="#0b1017" stroke="#222f42" stroke-width="1"/>
        <text x="14" y="32" fill="#5eead4" font-size="14" letter-spacing="3">••••••••••••••••</text>
        
        <text y="70" fill="#8b949e">Cryptographic Salt</text>
        <rect y="80" width="280" height="32" rx="6" fill="#0b1017" stroke="#222f42" stroke-width="1"/>
        <text x="14" y="101" fill="#a5d6ff" font-size="11">CSPRNG // 256-bit unique</text>

        <text y="142" fill="#7ee787">✓ Diceware 5+ words (~80 bits)</text>
      </g>
    </g>

    <!-- Connector Arrow 1 to 2 -->
    <g transform="translate(325, 110)">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#5eead4" stroke-width="2.5" stroke-dasharray="4,4"/>
      <polygon points="50,-6 60,0 50,6" fill="#5eead4"/>
    </g>

    <!-- Step 2: KDF Engine (Argon2id) -->
    <g transform="translate(390, 0)" filter="url(#glow-cipher)">
      <rect width="320" height="240" rx="14" fill="url(#box-grad)" stroke="#5eead4" stroke-width="1.8"/>
      <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 306 0 C 313.732 0 320 6.268 320 14 L 320 40 L 0 40 Z" fill="#1b2535"/>
      <line x1="0" y1="40" x2="320" y2="40" stroke="#2a3a52" stroke-width="1"/>
      
      <circle cx="20" cy="20" r="5" fill="#38bdf8"/>
      <text x="35" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f8fafc">02 // ARGON2id KDF</text>
      <text x="300" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5eead4" text-anchor="end">GPU-RESIST</text>

      <g transform="translate(20, 68)" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">
        <text y="0" fill="#8b949e">Memory Cost (m_cost):</text>
        <text x="180" y="0" fill="#5eead4" font-weight="700">64 MB RAM</text>
        
        <text y="28" fill="#8b949e">Time Iterations (t_cost):</text>
        <text x="180" y="28" fill="#5eead4" font-weight="700">3 passes</text>

        <text y="56" fill="#8b949e">Parallelism (p_cost):</text>
        <text x="180" y="56" fill="#5eead4" font-weight="700">4 threads</text>

        <rect y="78" width="280" height="68" rx="6" fill="#0b1017" stroke="#222f42" stroke-width="1"/>
        <text x="12" y="98" fill="#a5d6ff" font-size="11">Target: Master Key</text>
        <text x="12" y="118" fill="#7ee787" font-size="11">256-bit AES Derived Key</text>
        <text x="12" y="136" fill="#94a3b8" font-size="10">Never leaves client device</text>
      </g>
    </g>

    <!-- Connector Arrow 2 to 3 -->
    <g transform="translate(715, 110)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#5eead4" stroke-width="2.5" stroke-dasharray="4,4"/>
      <polygon points="40,-6 50,0 40,6" fill="#5eead4"/>
    </g>

    <!-- Step 3: Local Vault Ciphertext -->
    <g transform="translate(770, 0)" filter="url(#glow-cipher)">
      <rect width="310" height="240" rx="14" fill="url(#box-grad)" stroke="#27384e" stroke-width="1.5"/>
      <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 296 0 C 303.732 0 310 6.268 310 14 L 310 40 L 0 40 Z" fill="#1b2535"/>
      <line x1="0" y1="40" x2="310" y2="40" stroke="#2a3a52" stroke-width="1"/>
      
      <circle cx="20" cy="20" r="5" fill="#2dd4bf"/>
      <text x="35" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f8fafc">03 // ENCRYPTED VAULT</text>

      <g transform="translate(20, 68)" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">
        <text y="0" fill="#8b949e">Cipher Algorithm</text>
        <text y="20" fill="#5eead4" font-weight="700">AES-256-GCM / ChaCha20</text>

        <text y="50" fill="#8b949e">Payload at rest</text>
        <rect y="60" width="270" height="42" rx="6" fill="#0b1017" stroke="#222f42" stroke-width="1"/>
        <text x="12" y="85" fill="#a5d6ff" font-size="10.5">8f9b2...e1c (Ciphertext)</text>

        <text y="132" fill="#7ee787">✓ HMAC SHA-256 integrity</text>
      </g>
    </g>
  </g>

  <!-- LOWER PANEL: ARCHITECTURE COMPARISON (KeePassXC vs Bitwarden) -->
  <g transform="translate(60, 405)" filter="url(#glow-cipher)">
    <rect width="1080" height="230" rx="16" fill="#0d131b" stroke="#253346" stroke-width="1.2"/>
    
    <!-- Title -->
    <text x="35" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#f8fafc">
      THREAT MODEL &amp; SOVEREIGN ARCHITECTURES
    </text>

    <!-- 3 Pillars Cards -->
    <!-- Card A: KeePassXC -->
    <g transform="translate(35, 60)">
      <rect width="320" height="145" rx="10" fill="#131b26" stroke="#253346" stroke-width="1"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#5eead4">KeePassXC (Offline 100%)</text>
      <text x="20" y="58" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#e2e8f0">• Base locale .kdbx chiffrée</text>
      <text x="20" y="80" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#e2e8f0">• Zéro dépendance serveur / cloud</text>
      <text x="20" y="102" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#e2e8f0">• Clé physique YubiKey HMAC-SHA1</text>
      <text x="20" y="126" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7ee787">✓ Étanchéité réseau absolue</text>
    </g>

    <!-- Card B: Bitwarden / Vaultwarden -->
    <g transform="translate(380, 60)">
      <rect width="320" height="145" rx="10" fill="#131b26" stroke="#253346" stroke-width="1"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8">Vaultwarden (Self-Hosted)</text>
      <text x="20" y="58" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#e2e8f0">• Déchiffrement 100% côté client</text>
      <text x="20" y="80" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#e2e8f0">• Serveur aveugle (Zero-Knowledge)</text>
      <text x="20" y="102" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#e2e8f0">• Synchronisation multi-appareils</text>
      <text x="20" y="126" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">✓ Souveraineté auto-hébergée</text>
    </g>

    <!-- Card C: Security Checklist -->
    <g transform="translate(725, 60)">
      <rect width="320" height="145" rx="10" fill="#131b26" stroke="#253346" stroke-width="1"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#2dd4bf">Bonnes Pratiques 2026</text>
      <text x="20" y="58" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#e2e8f0">• Clés matérielles FIDO2 / WebAuthn</text>
      <text x="20" y="80" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#e2e8f0">• Bannir les SMS &amp; emails pour le MFA</text>
      <text x="20" y="102" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#e2e8f0">• Sauvegardes chiffrées hors-ligne 3-2-1</text>
      <text x="20" y="126" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5eead4">✓ Résilience cryptographique</text>
    </g>
  </g>
</svg>
